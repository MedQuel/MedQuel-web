<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page Not Found | MedQuel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #fff;
        text-align: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: linear-gradient(135deg, #0a0e27 0%, #1e2a4a 100%);
      }
      .container {
        max-width: 600px;
      }
      h1 {
        font-size: 120px;
        font-weight: 800;
        background: linear-gradient(135deg, #2563eb, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      p {
        font-size: 18px;
        color: #94a3b8;
        margin-bottom: 40px;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 16px 32px;
        background: linear-gradient(135deg, #2563eb, #10b981);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 18px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(37, 99, 235, 0.5);
      }
      .logo {
        margin-bottom: 30px;
        font-size: 28px;
        font-weight: 700;
        color: #2563eb;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">MedQuel</div>

      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
      </p>

      <a href="/" class="btn">Go Back Home</a>
    </div>
  </body>
</html>
